<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>llamaChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
/* ─── Reset ─── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: #212121;
  color: #ececec;
  display: flex;
  height: 100vh;
}
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 99px; }

/* ═══════════════════════════
   SIDEBAR
═══════════════════════════ */
#sidebar {
  width: 260px;
  min-width: 260px;
  height: 100vh;
  background: #171717;
  display: flex;
  flex-direction: column;
  padding: 8px;
  overflow: hidden;
  transition: transform 0.28s cubic-bezier(.4,0,.2,1);
  position: relative;
  z-index: 50;
  flex-shrink: 0;
}

.sb-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 6px 10px;
}
.brand {
  display: flex; align-items: center; gap: 9px;
  font-size: 15px; font-weight: 600; color: #fff;
}
.brand-icon {
  width: 28px; height: 28px;
  background: #10a37f;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.brand-icon svg { width: 16px; height: 16px; color: #fff; }

.iBtn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: none; color: #8e8ea0;
  border-radius: 7px; cursor: pointer;
  transition: background .15s, color .15s;
}
.iBtn:hover { background: #2a2a2a; color: #ececec; }
.iBtn svg { width: 17px; height: 17px; }

/* Sidebar buttons */
.sb-btn {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 8px 10px;
  background: none; border: none; border-radius: 8px;
  color: #ececec; font-size: 13.5px; font-family: inherit;
  cursor: pointer; text-align: left;
  transition: background .15s;
}
.sb-btn:hover { background: #2a2a2a; }
.sb-btn svg { width: 15px; height: 15px; color: #8e8ea0; flex-shrink: 0; }
.sb-btn.muted { color: #8e8ea0; }

/* Divider */
.sb-divider { height: 1px; background: #2a2a2a; margin: 6px 0; }

/* Model block */
.sb-section { padding: 6px 2px; }
.sb-label {
  font-size: 11px; color: #555; font-weight: 500;
  text-transform: uppercase; letter-spacing: .08em;
  padding: 0 8px 5px; display: block;
}
.recent-label { padding: 6px 10px; display: block; }
.sel-wrap { position: relative; }
.sel-wrap select {
  width: 100%; padding: 7px 30px 7px 10px;
  background: #2a2a2a; color: #ececec;
  border: 1px solid #333; border-radius: 7px;
  font-family: inherit; font-size: 13px;
  appearance: none; cursor: pointer; outline: none;
  transition: border-color .15s;
}
.sel-wrap select:hover { border-color: #555; }
.sel-wrap select:focus { border-color: #10a37f; }
.sel-arr {
  position: absolute; right: 8px; top: 50%;
  transform: translateY(-50%);
  pointer-events: none; color: #666;
  width: 13px; height: 13px;
}
.ref-btn {
  display: flex; align-items: center; gap: 6px;
  width: 100%; margin-top: 5px; padding: 5px 10px;
  background: none; border: 1px solid #2a2a2a; border-radius: 6px;
  color: #666; font-family: inherit; font-size: 12px;
  cursor: pointer; transition: all .15s;
}
.ref-btn:hover { border-color: #444; color: #ececec; }
.ref-btn svg { width: 11px; height: 11px; }
.ref-btn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* System Prompt */
.sys-ta {
  width: 100%; padding: 7px 9px;
  background: #2a2a2a; color: #ececec;
  border: 1px solid #333; border-radius: 7px;
  font-family: inherit; font-size: 12px; line-height: 1.5;
  resize: none; outline: none;
  min-height: 68px; max-height: 110px;
  transition: border-color .15s;
}
.sys-ta:focus { border-color: #10a37f; }
.sys-ta::placeholder { color: #555; }

/* Hide system prompt UI by default (still available in DOM as #sysPrompt) */
.sys-section { display: none; }

/* History */
.hist-list { flex: 1; overflow-y: auto; padding-bottom: 6px; }
.h-item {
  padding: 7px 10px; border-radius: 7px;
  font-size: 13px; color: #8e8ea0;
  cursor: pointer; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
  transition: background .15s, color .15s;
}
.h-item { position: relative; padding-right: 40px; }
.h-more {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: #8e8ea0;
  width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
  border-radius: 6px; cursor: pointer; padding: 4px;
}
.h-more:hover { background: #2a2a2a; color: #ececec; }
.h-more svg{ width: 14px; height: 14px; }
.h-item:hover { background: #2a2a2a; color: #ececec; }
.h-item.active { background: #2a2a2a; color: #ececec; }
.no-hist { font-size: 12px; color: #555; text-align: center; padding: 14px 0; }

/* Footer */
.sb-foot { border-top: 1px solid #2a2a2a; padding-top: 8px; margin-top: auto; }
.status {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px;
  font-size: 13px; color: #8e8ea0; border-radius: 7px;
}
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #555; flex-shrink: 0; transition: all .4s;
}
.dot.on  { background: #10a37f; box-shadow: 0 0 6px #10a37f; animation: blink 2s ease-in-out infinite; }
.dot.off { background: #ef4444; }
.dot.chk { background: #f59e0b; animation: blink 1s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

/* ═══════════════════════════
   OVERLAY
═══════════════════════════ */
#overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.55); z-index: 40;
  opacity: 0; transition: opacity .25s;
}
#overlay.vis { opacity: 1; }

/* ═══════════════════════════
   MAIN
═══════════════════════════ */
#main {
  flex: 1; display: flex; flex-direction: column;
  height: 100vh; overflow: hidden;
  background: #212121; min-width: 0;
}

/* Topbar */
#topbar {
  height: 52px; min-height: 52px;
  display: flex; align-items: center;
  padding: 0 14px; gap: 8px;
  border-bottom: 1px solid #2a2a2a;
  flex-shrink: 0;
}
.ham {
  display: none;
  background: none; border: none; color: #8e8ea0;
  width: 32px; height: 32px; border-radius: 7px;
  align-items: center; justify-content: center;
  cursor: pointer; transition: background .15s;
}
.ham:hover { background: #2a2a2a; color: #ececec; }
.ham svg { width: 17px; height: 17px; }
.tb-title {
  flex: 1; text-align: center;
  font-size: 14px; font-weight: 500; color: #ececec;
}
.clr-btn {
  background: none; border: none; color: #8e8ea0;
  width: 32px; height: 32px; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background .15s, color .15s;
}
.clr-btn:hover { background: #2a2a2a; color: #ef4444; }
.clr-btn svg { width: 16px; height: 16px; }

/* Chat wrapper */
#chatWrap {
  flex: 1; overflow-y: auto;
  display: flex; flex-direction: column;
}

/* Welcome */
#welcome {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 20px;
  animation: fu .45s ease;
}
@keyframes fu { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }

.wlogo {
  width: 52px; height: 52px;
  background: #10a37f; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 22px;
  animation: fl 3s ease-in-out infinite;
}
@keyframes fl { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
.wlogo svg { width: 28px; height: 28px; color: #fff; }

.w-title {
  font-size: 26px; font-weight: 600;
  letter-spacing: -.4px; margin-bottom: 6px; text-align: center;
}
.w-sub { font-size: 13px; color: #666; margin-bottom: 32px; text-align: center; }

.chips {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; max-width: 540px; width: 100%;
}
.chip {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 13px 15px;
  background: #2a2a2a; border: 1px solid #333;
  border-radius: 12px; cursor: pointer;
  font-family: inherit; text-align: left;
  transition: all .15s;
  animation: fu .45s ease both;
}
.chip:nth-child(1){animation-delay:.06s}
.chip:nth-child(2){animation-delay:.12s}
.chip:nth-child(3){animation-delay:.18s}
.chip:nth-child(4){animation-delay:.24s}
.chip:hover { background: #333; border-color: #10a37f; transform: translateY(-1px); }
.chip-icon { font-size: 17px; flex-shrink: 0; line-height: 1.3; }
.chip-txt { font-size: 13px; color: #ccc; line-height: 1.4; }

/* Messages */
#msgs {
  display: none; flex-direction: column;
  padding: 12px 0 24px;
}

.mrow { display: flex; animation: fu .22s ease; }

/* User */
.mrow.user { justify-content: flex-end; padding: 5px 20px; }
.mrow.user .bbl {
  background: #2f2f2f; border: 1px solid #3a3a3a;
  border-radius: 18px 18px 4px 18px;
  padding: 11px 15px; max-width: 72%;
  font-size: 14.5px; line-height: 1.65; color: #ececec;
}

/* Assistant */
.mrow.asst {
  padding: 5px 20px; gap: 11px;
  align-items: flex-start;
  max-width: 840px; width: 100%; margin: 0 auto;
}
.ai-av {
  width: 28px; height: 28px; border-radius: 50%;
  background: #10a37f;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; margin-top: 3px;
}
.ai-av svg { width: 15px; height: 15px; color: #fff; }
.mrow.asst .bbl { flex: 1; min-width: 0; font-size: 14.5px; line-height: 1.7; color: #ececec; }

/* Markdown */
.bbl p { margin: 0 0 9px; }
.bbl p:last-child { margin-bottom: 0; }
.bbl ul,.bbl ol { padding-left: 20px; margin: 7px 0; }
.bbl li { margin: 3px 0; }
.bbl h1,.bbl h2,.bbl h3 { font-weight: 600; margin: 13px 0 5px; color: #fff; }
.bbl h1{font-size:1.2em}.bbl h2{font-size:1.1em}.bbl h3{font-size:1em}
.bbl strong { font-weight: 600; color: #fff; }
.bbl em { color: #aaa; }
.bbl :not(pre)>code {
  background: #1e1e1e; color: #7dd3fc;
  padding: 2px 5px; border-radius: 4px;
  font-family: monospace; font-size: 13px;
}
.bbl hr { border: none; border-top: 1px solid #333; margin: 10px 0; }

/* Code block */
.cb {
  background: #1a1a1a; border: 1px solid #2e2e2e;
  border-radius: 9px; overflow: hidden; margin: 11px 0;
}
.cb-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 13px; background: #212121; border-bottom: 1px solid #2e2e2e;
}
.cb-lang { font-size: 11px; color: #666; font-weight: 500; }
.cpbtn {
  background: none; border: none; color: #666;
  font-size: 12px; font-family: inherit;
  cursor: pointer; padding: 3px 8px; border-radius: 5px;
  transition: all .15s; display: flex; align-items: center; gap: 4px;
}
.cpbtn:hover { background: #333; color: #ececec; }
.cpbtn svg { width: 12px; height: 12px; }
.cb pre { padding: 13px 15px; overflow-x: auto; margin: 0; }
.cb code { font-family: monospace; font-size: 13px; line-height: 1.6; color: #e2e8f0; }

/* Message actions */
.macts {
  display: flex; gap: 2px; margin-top: 5px;
  opacity: 0; transition: opacity .15s;
}
.mrow:hover .macts { opacity: 1; }
.mrow.user .macts { justify-content: flex-end; }
.abtn {
  background: none; border: none; color: #666;
  padding: 4px 7px; border-radius: 5px; cursor: pointer;
  display: flex; align-items: center; gap: 4px;
  font-size: 12px; font-family: inherit;
  transition: background .15s, color .15s;
}
.abtn:hover { background: #2a2a2a; color: #ececec; }
.abtn svg { width: 12px; height: 12px; }
.ts { color: #444; font-size: 11px; padding: 4px 6px; }

/* Typing */
.tydots {
  display: flex; align-items: center; gap: 4px; padding: 2px 0;
}
.tydots span {
  width: 7px; height: 7px; border-radius: 50%;
  background: #555; display: inline-block;
  animation: tb 1.2s ease-in-out infinite;
}
.tydots span:nth-child(2){animation-delay:.18s}
.tydots span:nth-child(3){animation-delay:.36s}
@keyframes tb { 0%,60%,100%{transform:translateY(0);background:#555} 30%{transform:translateY(-6px);background:#10a37f} }

/* ═══════════════════════════
   INPUT
═══════════════════════════ */
#inputArea {
  padding: 10px 18px 14px;
  border-top: 1px solid #2a2a2a;
  flex-shrink: 0;
}
.ibox {
  display: flex; align-items: flex-end; gap: 6px;
  background: #2f2f2f; border: 1px solid #3a3a3a;
  border-radius: 15px; padding: 9px 10px 9px 14px;
  max-width: 760px; margin: 0 auto;
  transition: border-color .2s;
}
.ibox:focus-within { border-color: #555; }
.ibox textarea {
  flex: 1; background: none; border: none; outline: none;
  color: #ececec; font-family: inherit; font-size: 14.5px;
  line-height: 1.55; resize: none; max-height: 175px; overflow-y: auto;
}
.ibox textarea::placeholder { color: #555; }
.ibox textarea::-webkit-scrollbar { display: none; }

.sndbtn {
  width: 34px; height: 34px;
  background: #fff; color: #1a1a1a;
  border: none; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: background .15s, transform .1s;
}
.sndbtn:disabled { background: #333; color: #555; cursor: not-allowed; }
.sndbtn:not(:disabled):hover { background: #e0e0e0; }
.sndbtn:not(:disabled):active { transform: scale(.94); }
.sndbtn svg { width: 15px; height: 15px; }
.sndbtn.stop { background: #ef4444; color: #fff; }
.sndbtn.stop:not(:disabled):hover { background: #dc2626; }

.inp-note {
  text-align: center; font-size: 11.5px; color: #555;
  margin-top: 7px; max-width: 760px; margin-left: auto; margin-right: auto;
}

/* Toast */
#toast {
  position: fixed; bottom: 76px; left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: #2f2f2f; border: 1px solid #444; color: #ececec;
  padding: 8px 16px; border-radius: 9px; font-size: 13px;
  pointer-events: none; opacity: 0;
  transition: all .2s; z-index: 999; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Responsive */
@media (max-width: 760px) {
  #sidebar {
    position: fixed; top: 0; left: 0; height: 100vh;
    transform: translateX(-100%);
    z-index: 60; box-shadow: 4px 0 24px rgba(0,0,0,.55);
  }
  #sidebar.open { transform: translateX(0); }
  #overlay { display: block; }
  .ham { display: flex; }
  .chips { grid-template-columns: 1fr; max-width: 100%; }
  .w-title { font-size: 21px; }
  .mrow.user, .mrow.asst { padding: 5px 12px; }
  .mrow.asst { max-width: 100%; }
  .mrow.user .bbl { max-width: 90%; }
  #inputArea { padding: 8px 10px 12px; }
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<aside id="sidebar">
  <div class="sb-top">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 12c0-2.21 1.79-4 4-4s4 1.79 4 4-1.79 4-4 4" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      llamaChat
    </div>
    <button class="iBtn" id="sbClose" aria-label="Close sidebar" title="Close sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <button class="sb-btn" id="newChatBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
    New chat
  </button>
  <button class="sb-btn muted">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    Search chats
  </button>

  <div class="sb-divider"></div>

    <div class="sb-section">
    <span class="sb-label">Model</span>
    <div class="sel-wrap">
      <select id="modelSel" aria-label="Model selection">
        <option value="llama3.2">llama3.2</option>
        <option value="llama3.1">llama3.1</option>
        <option value="mistral">mistral</option>
        <option value="gemma2">gemma2</option>
        <option value="phi3">phi3</option>
        <option value="codellama">codellama</option>
        <option value="deepseek-coder">deepseek-coder</option>
        <option value="qwen2.5">qwen2.5</option>
      </select>
      <svg class="sel-arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <button class="ref-btn" id="refBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
      Refresh models
    </button>
  </div>

  <div class="sb-divider"></div>

  <div class="sb-section sys-section" aria-hidden="true">
    <span class="sb-label">System Prompt</span>
    <textarea class="sys-ta" id="sysPrompt" rows="3" placeholder="You are a helpful AI assistant...">You are a helpful, harmless, and honest AI assistant. Be concise and friendly.</textarea>
  </div>

  <div class="sb-divider"></div>

  <span class="sb-label recent-label">Recent</span>
  <div class="hist-list" id="histList"><div class="no-hist">No chats yet</div></div>

  <div class="sb-foot">
    <div class="status">
      <div class="dot chk" id="dot"></div>
      <span id="stTxt">Checking Ollama…</span>
    </div>
  </div>
</aside>

<div id="overlay"></div>

<!-- MAIN -->
<main id="main">
  <header id="topbar">
    <button class="ham" id="ham" aria-label="Toggle sidebar" title="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <div class="tb-title" id="tbTitle">llama3.2</div>
      <button class="clr-btn" id="clrBtn" title="Clear chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
    </button>
  </header>

  <div id="chatWrap">
    <!-- Welcome -->
    <div id="welcome">
      <div class="wlogo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M8 12c0-2.21 1.79-4 4-4s4 1.79 4 4-1.79 4-4 4" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <h1 class="w-title">What's on the agenda today?</h1>
      <p class="w-sub">Running locally via Ollama &middot; <span id="wMdl">llama3.2</span></p>
      <div class="chips">
        <button class="chip" data-p="Explain quantum computing in simple terms with a real-world analogy">
          <span class="chip-icon">⚛️</span><span class="chip-txt">Explain quantum computing</span>
        </button>
        <button class="chip" data-p="Write a Python function to sort a list of dictionaries by a specific key">
          <span class="chip-icon">🐍</span><span class="chip-txt">Write Python sorting code</span>
        </button>
        <button class="chip" data-p="What are the best practices for REST API design? Give me 5 key principles">
          <span class="chip-icon">🔌</span><span class="chip-txt">REST API best practices</span>
        </button>
        <button class="chip" data-p="Write a short creative story about an astronaut who discovers an alien library on Mars">
          <span class="chip-icon">✍️</span><span class="chip-txt">Write or edit text</span>
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div id="msgs"></div>
  </div>

  <div id="inputArea">
    <div class="ibox">
      <textarea id="inp" placeholder="Ask anything" rows="1"></textarea>
      <button class="sndbtn" id="sndBtn" aria-label="Send message" title="Send message" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5m-7 7l7-7 7 7"/></svg>
      </button>
    </div>
    <p class="inp-note">OllamaChat runs locally. Your data never leaves your machine.</p>
  </div>
</main>

<div id="toast"></div>

<script>
const BASE = 'http://localhost:11434';
let chats = JSON.parse(localStorage.getItem('oc2')|| '{}');
let cid = null, streaming = false, ctl = null;

const sidebar  = document.getElementById('sidebar');
const overlay  = document.getElementById('overlay');
const ham      = document.getElementById('ham');
const sbClose  = document.getElementById('sbClose');
const newBtn   = document.getElementById('newChatBtn');
const mdlSel   = document.getElementById('modelSel');
const refBtn   = document.getElementById('refBtn');
const sysP     = document.getElementById('sysPrompt');
const histList = document.getElementById('histList');
const dot      = document.getElementById('dot');
const stTxt    = document.getElementById('stTxt');
const tbTitle  = document.getElementById('tbTitle');
const wMdl     = document.getElementById('wMdl');
const clrBtn   = document.getElementById('clrBtn');
const chatWrap = document.getElementById('chatWrap');
const welcome  = document.getElementById('welcome');
const msgs     = document.getElementById('msgs');
const inp      = document.getElementById('inp');
const sndBtn   = document.getElementById('sndBtn');
const toast    = document.getElementById('toast');

// ── Sidebar ──────────────────
function openSB()  { sidebar.classList.add('open'); overlay.classList.add('vis'); }
function closeSB() { sidebar.classList.remove('open'); overlay.classList.remove('vis'); }
ham.onclick = openSB; sbClose.onclick = closeSB; overlay.onclick = closeSB;

// ── Toast ─────────────────────
let _tt;
function showToast(m) {
  toast.textContent = m; toast.classList.add('show');
  clearTimeout(_tt); _tt = setTimeout(()=>toast.classList.remove('show'), 2100);
}

// ── Status ────────────────────
async function checkStatus() {
  dot.className='dot chk'; stTxt.textContent='Checking…';
  try {
    const r = await fetch(`${BASE}/api/tags`,{signal:AbortSignal.timeout(3000)});
    if(r.ok){dot.className='dot on'; stTxt.textContent='Ollama connected'; return true;}
  } catch{}
  dot.className='dot off'; stTxt.textContent='Ollama offline'; return false;
}

async function loadModels() {
  refBtn.classList.add('spin');
  try {
    const r = await fetch(`${BASE}/api/tags`,{signal:AbortSignal.timeout(5000)});
    if(!r.ok) throw 0;
    const d = await r.json();
    const ms = d.models||[];
    if(ms.length){
      const cur = mdlSel.value;
      mdlSel.innerHTML = ms.map(m=>`<option value="${m.name}" ${m.name===cur?'selected':''}>${m.name}</option>`).join('');
      showToast(`${ms.length} model${ms.length>1?'s':''} found`);
    } else showToast('No models. Run: ollama pull llama3.2');
  } catch { showToast('Cannot reach Ollama'); }
  refBtn.classList.remove('spin');
}

refBtn.onclick = loadModels;
mdlSel.onchange = () => { tbTitle.textContent=mdlSel.value; wMdl.textContent=mdlSel.value; };

// ── Conversations ─────────────
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2); }
function save(){ localStorage.setItem('oc2',JSON.stringify(chats)); }

function newChat(){
  const id=uid();
  chats[id]={id,title:'New Chat',msgs:[],model:mdlSel.value,ts:Date.now()};
  cid=id; save(); renderHist(); showWelcome();
}

function showWelcome(){ welcome.style.display='flex'; msgs.style.display='none'; msgs.innerHTML=''; }
function showChat()   { welcome.style.display='none'; msgs.style.display='flex'; }

function loadChat(id){
  if(!chats[id]) return;
  cid=id; msgs.innerHTML='';
  const c=chats[id];
  if(!c.msgs.length){ showWelcome(); }
  else { showChat(); c.msgs.forEach(m=>addMsg(m.role,m.content,false)); }
  if(c.model){ mdlSel.value=c.model; tbTitle.textContent=c.model; wMdl.textContent=c.model; }
  renderHist(); closeSB(); scrollBot();
}

function deleteChat(id){
  if(!chats[id]) return;
  if(!confirm('Delete this conversation?')) return;
  const wasOpen = cid===id;
  delete chats[id];
  if(wasOpen){ cid=null; showWelcome(); }
  save(); renderHist();
}

function renderHist(){
  const cs=Object.values(chats).sort((a,b)=>b.ts-a.ts);
  if(!cs.length){ histList.innerHTML='<div class="no-hist">No chats yet</div>'; return; }
  histList.innerHTML=cs.map(c=>
    `<div class="h-item ${c.id===cid?'active':''}" data-id="${c.id}">
        ${xe(c.title)}
        <button class="h-more" data-id="${c.id}" aria-label="Delete chat" title="Delete chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 12h.01M12 12h.01M18 12h.01" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
     </div>`
  ).join('');

  histList.querySelectorAll('.h-item').forEach(el=>{
    el.onclick = ()=>loadChat(el.dataset.id);
    const btn = el.querySelector('.h-more');
    if(btn){ btn.onclick = (e)=>{ e.stopPropagation(); deleteChat(btn.dataset.id); }; }
  });
}

newBtn.onclick = ()=>{ newChat(); closeSB(); };

clrBtn.onclick = ()=>{
  if(!cid||!chats[cid]) return;
  if(!confirm('Clear this conversation?')) return;
  chats[cid].msgs=[]; chats[cid].title='New Chat';
  save(); renderHist(); showWelcome();
};

// ── Markdown ──────────────────
function xe(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function md(raw){
  let h=raw;
  // fenced code
  h=h.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,lang,code)=>{
    const id='c'+Math.random().toString(36).slice(2);
    return `<div class="cb"><div class="cb-head"><span class="cb-lang">${xe(lang||'code')}</span>`+
      `<button class="cpbtn" onclick="cpCode('${id}',this)">`+
      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy`+
      `</button></div><pre><code id="${id}">${xe(code.trim())}</code></pre></div>`;
  });
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/__(.+?)__/g,'<strong>$1</strong>');
  h=h.replace(/\*(.+?)\*/g,'<em>$1</em>');
  h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  h=h.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  h=h.replace(/^[-*+] (.+)$/gm,'<li>$1</li>');
  h=h.replace(/(<li>[\s\S]+?<\/li>)/g,'<ul>$1</ul>');
  h=h.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  h=h.replace(/^---$/gm,'<hr>');
  h=h.split(/\n\n+/).map(b=>{
    if(/^<(h[1-3]|ul|ol|div|pre|hr)/.test(b.trim())) return b;
    return `<p>${b.replace(/\n/g,'<br>')}</p>`;
  }).join('');
  return h;
}

function cpCode(id,btn){
  const t=document.getElementById(id)?.innerText||'';
  navigator.clipboard.writeText(t).then(()=>{ btn.textContent='Copied!'; setTimeout(()=>btn.textContent='Copy',1800); });
}

// ── Add message ───────────────
function addMsg(role,content,animate=true){
  showChat();
  const row=document.createElement('div');
  row.className=`mrow ${role==='user'?'user':'asst'}`;
  if(!animate) row.style.animation='none';
  const ts=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});

  if(role==='user'){
    row.innerHTML=`<div>
      <div class="bbl">${xe(content)}</div>
      <div class="macts">
        <button class="abtn" onclick="cp(\`${xe(content)}\`)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy
        </button>
        <span class="ts">${ts}</span>
      </div></div>`;
  } else {
    row.innerHTML=`
      <div class="ai-av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M8 12c0-2.21 1.79-4 4-4s4 1.79 4 4-1.79 4-4 4" stroke-linecap="round"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg></div>
      <div>
        <div class="bbl">${md(content)}</div>
        <div class="macts">
          <button class="abtn cp-ai">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy
          </button>
          <span class="ts">${ts}</span>
        </div>
      </div>`;
    row.querySelector('.cp-ai').onclick=()=>navigator.clipboard.writeText(content).then(()=>showToast('Copied!'));
  }
  msgs.appendChild(row); scrollBot(); return row;
}

function cp(t){ navigator.clipboard.writeText(t).then(()=>showToast('Copied!')); }

// ── Typing indicator ──────────
function addTyping(){
  const r=document.createElement('div');
  r.className='mrow asst'; r.id='tyi';
  r.innerHTML=`<div class="ai-av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M8 12c0-2.21 1.79-4 4-4s4 1.79 4 4-1.79 4-4 4" stroke-linecap="round"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg></div>
    <div class="bbl"><div class="tydots"><span></span><span></span><span></span></div></div>`;
  msgs.appendChild(r); scrollBot(); return r;
}
function rmTyping(){ document.getElementById('tyi')?.remove(); }

// ── Stream ────────────────────
async function stream(userMsg){
  if(!cid) newChat();
  const chat=chats[cid];
  const model=mdlSel.value;
  const sys=sysP.value.trim();

  const omsg=[];
  if(sys) omsg.push({role:'system',content:sys});
  chat.msgs.forEach(m=>omsg.push({role:m.role,content:m.content}));
  omsg.push({role:'user',content:userMsg});

  chat.msgs.push({role:'user',content:userMsg});
  if(chat.msgs.length===1){ chat.title=userMsg.slice(0,44)+(userMsg.length>44?'…':''); chat.model=model; }
  save(); renderHist();

  addTyping(); streaming=true; ctl=new AbortController(); setStop();

  let full=''; let aiRow=null; let bbl=null;

  try {
    const res=await fetch(`${BASE}/api/chat`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      signal:ctl.signal,
      body:JSON.stringify({model,messages:omsg,stream:true})
    });
    if(!res.ok) throw new Error(await res.text()||`HTTP ${res.status}`);

    rmTyping(); showChat();
    aiRow=document.createElement('div');
    aiRow.className='mrow asst';
    aiRow.innerHTML=`<div class="ai-av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M8 12c0-2.21 1.79-4 4-4s4 1.79 4 4-1.79 4-4 4" stroke-linecap="round"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg></div>
      <div><div class="bbl"></div><div class="macts"><button class="abtn cp-ai"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy</button></div></div>`;
    msgs.appendChild(aiRow); bbl=aiRow.querySelector('.bbl');

    const rdr=res.body.getReader(); const dec=new TextDecoder();
    while(true){
      const {done,value}=await rdr.read(); if(done) break;
      const lines=dec.decode(value,{stream:true}).split('\n').filter(l=>l.trim());
      for(const line of lines){
        try{ const j=JSON.parse(line); if(j.message?.content){ full+=j.message.content; bbl.innerHTML=md(full); scrollBot(); } if(j.done) break; }catch{}
      }
    }

    // Finalize
    const ts=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    const acts=aiRow.querySelector('.macts');
    acts.style.opacity='';
    acts.querySelector('.cp-ai').onclick=()=>navigator.clipboard.writeText(full).then(()=>showToast('Copied!'));
    const tspan=document.createElement('span'); tspan.className='ts'; tspan.textContent=ts;
    acts.appendChild(tspan);

    chat.msgs.push({role:'assistant',content:full}); save();

  } catch(e){
    rmTyping();
    if(e.name==='AbortError'){
      if(full){ chat.msgs.push({role:'assistant',content:full+' [stopped]'}); save(); }
    } else {
      const em=e.message.includes('fetch')?'Cannot connect to Ollama. Make sure it\'s running:\n\nollama serve':e.message;
      const er=document.createElement('div'); er.className='mrow asst';
      er.innerHTML=`<div class="ai-av" style="background:#3d1414;font-size:13px">⚠</div>
        <div class="bbl" style="color:#f87171">${xe(em)}</div>`;
      msgs.appendChild(er); scrollBot();
    }
  } finally {
    streaming=false; ctl=null; setNormal(); chkSend();
  }
}

// ── Send btn ──────────────────
function setStop(){
  sndBtn.disabled=false; sndBtn.classList.add('stop');
  sndBtn.innerHTML=`<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`;
}
function setNormal(){
  sndBtn.classList.remove('stop');
  sndBtn.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5m-7 7l7-7 7 7"/></svg>`;
}
function chkSend(){ sndBtn.disabled=!inp.value.trim(); }

sndBtn.onclick=()=>{ if(streaming){ ctl?.abort(); return; } const t=inp.value.trim(); if(t) send(t); };

function send(text){
  if(!text||streaming) return;
  inp.value=''; inp.style.height='auto'; chkSend();
  addMsg('user',text); stream(text);
}

inp.oninput=()=>{ inp.style.height='auto'; inp.style.height=Math.min(inp.scrollHeight,175)+'px'; chkSend(); };
inp.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); if(!streaming&&inp.value.trim()) send(inp.value.trim()); } };

document.querySelectorAll('.chip').forEach(c=>{
  c.onclick=()=>{ const p=c.dataset.p; if(!cid) newChat(); addMsg('user',p); stream(p); };
});

function scrollBot(){ chatWrap.scrollTop=chatWrap.scrollHeight; }

// ── Init ─────────────────────
(async()=>{
  newChat(); renderHist();
  const ok=await checkStatus();
  if(ok) loadModels();
  setInterval(checkStatus, 15000);
})();
</script>
</body>
</html>
